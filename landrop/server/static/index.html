<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>LAN Drop</title>
    <link rel="icon" href="/logo.png" />
    <style>
      :root {
        --bg: #f5f7f6;
        --surface: #fff;
        --text: #18231e;
        --muted: #617169;
        --line: #d9e1dd;
        --accent: #246b48;
        --soft: #edf5ef;
        --error: #b33e42;
        --focus: #346fc0;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #161b18;
          --surface: #202722;
          --text: #edf3ee;
          --muted: #b2beb6;
          --line: #39453d;
          --accent: #80c89c;
          --soft: #293d30;
          --error: #ff9c9c;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #161b18;
        --surface: #202722;
        --text: #edf3ee;
        --muted: #b2beb6;
        --line: #39453d;
        --accent: #80c89c;
        --soft: #293d30;
        --error: #ff9c9c;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
        letter-spacing: 0;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      [hidden] {
        display: none !important;
      }
      button,
      input,
      textarea {
        font: inherit;
      }
      button,
      a,
      input,
      textarea {
        outline-offset: 3px;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      textarea:focus-visible {
        outline: 2px solid var(--focus);
      }
      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        min-height: 38px;
        padding: 7px 13px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--surface);
        color: var(--text);
        cursor: pointer;
        white-space: nowrap;
      }
      button:hover,
      a.tool:hover {
        background: var(--soft);
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .primary {
        background: var(--accent);
        color: var(--surface);
        border-color: var(--accent);
      }
      .primary:hover {
        filter: brightness(0.94);
        background: var(--accent);
      }
      .tool {
        width: 38px;
        height: 38px;
        min-width: 38px;
        padding: 9px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--muted);
        text-decoration: none;
      }
      .ic {
        width: 18px;
        height: 18px;
        min-width: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      header {
        height: 66px;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
      }
      .header-inner {
        max-width: 1040px;
        height: 100%;
        margin: auto;
        padding: 0 24px;
        display: flex;
        align-items: center;
        gap: 11px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 18px;
        font-weight: 650;
      }
      .brand img {
        width: 34px;
        height: 34px;
        object-fit: contain;
      }
      .header-tools {
        margin-left: auto;
        display: flex;
        gap: 4px;
      }
      main {
        max-width: 1040px;
        margin: auto;
        padding: 26px 24px 60px;
      }
      .login {
        max-width: 360px;
        margin: 72px auto 0;
      }
      .login h1 {
        font-size: 24px;
        line-height: 1.3;
        margin: 0 0 24px;
      }
      .login label {
        display: block;
        margin-bottom: 8px;
        color: var(--muted);
      }
      .login input {
        width: 100%;
        height: 56px;
        font:
          24px ui-monospace,
          monospace;
        text-align: center;
      }
      .login button {
        width: 100%;
        margin-top: 14px;
      }
      .error {
        color: var(--error);
        overflow-wrap: anywhere;
        min-height: 21px;
        margin: 12px 0 0;
      }
      input:not([type="checkbox"]),
      textarea {
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 9px 11px;
        background: var(--surface);
        color: var(--text);
        min-width: 0;
      }
      input[type="checkbox"] {
        accent-color: var(--accent);
        width: 17px;
        height: 17px;
        margin: 0;
        cursor: pointer;
      }
      .heading {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        margin-bottom: 24px;
      }
      .heading h1 {
        font-size: 20px;
        font-weight: 650;
        line-height: 1.4;
        margin: 0;
        overflow-wrap: anywhere;
      }
      .heading p {
        color: var(--muted);
        margin: 5px 0 0;
        font-size: 12px;
      }
      .tabs {
        display: flex;
        gap: 24px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 22px;
      }
      .tab {
        border: 0;
        border-radius: 0;
        background: transparent;
        padding: 9px 0;
        border-bottom: 2px solid transparent;
        color: var(--muted);
      }
      .tab[aria-selected="true"] {
        color: var(--accent);
        border-bottom-color: var(--accent);
      }
      .badge {
        font-size: 12px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .drop {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-height: 90px;
        border: 1px dashed var(--line);
        border-radius: 6px;
        background: var(--surface);
        margin-bottom: 12px;
      }
      .drop.drag {
        border-color: var(--accent);
        background: var(--soft);
      }
      .drop button {
        border: 0;
      }
      .section-tools {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 20px 0 10px;
        flex-wrap: wrap;
      }
      .search {
        flex: 1;
        min-width: 100px;
      }
      .file-head,
      .file-row {
        display: grid;
        grid-template-columns: 24px minmax(0, 1fr) 88px 88px;
        gap: 10px;
        align-items: center;
        padding: 11px 8px;
      }
      .file-head {
        font-size: 12px;
        color: var(--muted);
        border-bottom: 1px solid var(--line);
      }
      .file-row {
        border-bottom: 1px solid var(--line);
        min-height: 60px;
      }
      .file-row:hover {
        background: var(--soft);
      }
      .file-name {
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 11px;
      }
      .file-name > .ic {
        color: var(--muted);
      }
      .file-label {
        min-width: 0;
        flex: 1;
      }
      .file-label a {
        color: var(--text);
        text-decoration: none;
        overflow-wrap: anywhere;
      }
      .file-label a:hover {
        text-decoration: underline;
      }
      .path {
        display: block;
        font-size: 12px;
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      .size {
        font-size: 12px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 3px;
      }
      .empty {
        padding: 42px 12px;
        text-align: center;
        color: var(--muted);
        border-bottom: 1px solid var(--line);
      }
      .queue-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 100px 38px;
        gap: 10px;
        align-items: center;
        padding: 10px 8px;
        border-bottom: 1px solid var(--line);
      }
      .queue-name {
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .queue-name small {
        display: block;
        color: var(--muted);
      }
      .queue-state {
        font-size: 12px;
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      progress {
        width: 100%;
        height: 4px;
        display: block;
        accent-color: var(--accent);
        margin-top: 6px;
      }
      .text-compose {
        margin-bottom: 24px;
      }
      .text-compose textarea {
        display: block;
        width: 100%;
        min-height: 132px;
        resize: vertical;
        line-height: 1.55;
      }
      .text-compose .section-tools {
        justify-content: flex-end;
        margin-top: 10px;
      }
      .text-row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 8px;
        border-bottom: 1px solid var(--line);
      }
      .text-row .summary {
        flex: 1;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .text-row small {
        display: block;
        color: var(--muted);
      }
      dialog {
        width: min(900px, calc(100% - 32px));
        max-height: 85vh;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0;
        color: var(--text);
        background: var(--surface);
      }
      dialog::backdrop {
        background: #0008;
      }
      .dialog-head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--line);
      }
      .dialog-head h2 {
        font-size: 15px;
        margin: 0;
        min-width: 0;
        flex: 1;
        overflow-wrap: anywhere;
      }
      .preview-body {
        padding: 20px;
        max-height: 65vh;
        overflow: auto;
        min-height: 120px;
      }
      .preview-body img,
      .preview-body video {
        display: block;
        max-width: 100%;
        max-height: 58vh;
        margin: auto;
        object-fit: contain;
      }
      .preview-body audio {
        width: 100%;
      }
      .preview-body pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font:
          13px/1.6 ui-monospace,
          monospace;
        margin: 0;
      }
      .notice {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        max-width: calc(100% - 32px);
        padding: 10px 16px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--surface);
        box-shadow: 0 4px 20px #0002;
        overflow-wrap: anywhere;
        z-index: 5;
      }
      @media (max-width: 600px) {
        .header-inner {
          padding: 0 16px;
        }
        main {
          padding: 20px 16px 40px;
        }
        .login {
          margin-top: 40px;
        }
        .heading {
          margin-bottom: 18px;
        }
        .file-head,
        .file-row {
          grid-template-columns: 20px minmax(0, 1fr) 76px;
          gap: 8px;
          padding: 10px 0;
        }
        .file-head .size {
          display: none;
        }
        .file-row > .size {
          grid-column: 2;
          grid-row: 2;
          font-size: 11px;
        }
        .file-row .actions {
          grid-column: 3;
          grid-row: 1 / span 2;
        }
        .file-row .file-name {
          gap: 7px;
        }
        .file-row {
          row-gap: 0;
        }
        .section-tools button {
          padding: 7px 10px;
        }
        .queue-row {
          grid-template-columns: minmax(0, 1fr) 70px 34px;
          padding: 9px 0;
          gap: 6px;
        }
        .tool {
          width: 34px;
          height: 34px;
          min-width: 34px;
          padding: 8px;
        }
        .preview-body {
          padding: 14px;
        }
      }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <symbol id="i-upload" viewBox="0 0 24 24">
        <path
          d="M12 15V4.5m-4.5 4.5L12 4.5 16.5 9M4 14.5V18a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3.5"
        />
      </symbol>
      <symbol id="i-download" viewBox="0 0 24 24">
        <path d="M12 4v11m-4.5-4.5 4.5 4.5 4.5-4.5M5 20h14" />
      </symbol>
      <symbol id="i-eye" viewBox="0 0 24 24">
        <path
          d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"
        />
        <circle cx="12" cy="12" r="3" />
      </symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24">
        <path d="M20 12a8 8 0 1 1-2.35-5.65M20 4.5V9h-4.5" />
      </symbol>
      <symbol id="i-sun" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="4" />
        <path
          d="M12 2.8v2M12 19.2v2M5.5 5.5l1.4 1.4M17.1 17.1l1.4 1.4M2.8 12h2M19.2 12h2M5.5 18.5l1.4-1.4M17.1 6.9l1.4-1.4"
        />
      </symbol>
      <symbol id="i-logout" viewBox="0 0 24 24">
        <path
          d="M14.5 4H18a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3.5M9.5 16.5 5 12l4.5-4.5M5 12h10.5"
        />
      </symbol>
      <symbol id="i-x" viewBox="0 0 24 24">
        <path d="m6.5 6.5 11 11M17.5 6.5l-11 11" />
      </symbol>
      <symbol id="i-files" viewBox="0 0 24 24">
        <path
          d="M8.5 7V5.5a2 2 0 0 1 2-2h4.8l4.2 4.2v8.8a2 2 0 0 1-2 2H16M15 3.5v4.5h4.5"
        />
        <rect x="4.5" y="7" width="11.5" height="13.5" rx="2" />
      </symbol>
      <symbol id="i-text" viewBox="0 0 24 24">
        <path d="M5 6.5h14M5 11h14M5 15.5h9M5 20h6" />
      </symbol>
      <symbol id="i-folder" viewBox="0 0 24 24">
        <path
          d="M3.5 7.5a2 2 0 0 1 2-2h3.8a2 2 0 0 1 1.5.7l1.1 1.3h6.6a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2Z"
        />
      </symbol>
      <symbol id="i-file" viewBox="0 0 24 24">
        <path
          d="M14 3.5H7.5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2V8ZM14 3.5V8h4.5"
        />
      </symbol>
    </svg>
    <header>
      <div class="header-inner">
        <div class="brand"><img src="/logo.png" alt="" />LAN Drop</div>
        <div class="header-tools">
          <button
            id="theme"
            class="tool"
            title="切换主题"
            aria-label="切换主题"
          >
            <svg class="ic"><use href="#i-sun" /></svg></button
          ><button
            id="logout"
            class="tool"
            title="退出"
            aria-label="退出"
            hidden
          >
            <svg class="ic"><use href="#i-logout" /></svg>
          </button>
        </div>
      </div>
    </header>
    <main>
      <section id="login" class="login" aria-labelledby="login-title">
        <h1 id="login-title">输入授权码</h1>
        <form id="login-form">
          <label for="code">六位数字授权码</label
          ><input
            id="code"
            type="text"
            inputmode="numeric"
            pattern="[0-9]{6}"
            maxlength="6"
            autocomplete="one-time-code"
            required
          /><button id="login-button" class="primary" type="submit">
            进入分享
          </button>
          <p id="login-error" class="error" role="alert"></p>
        </form>
      </section>
      <section id="content" hidden>
        <div class="heading">
          <div>
            <h1 id="share-name"></h1>
            <p id="expires"></p>
          </div>
        </div>
        <nav class="tabs" role="tablist" aria-label="分享内容">
          <button
            id="files-tab"
            class="tab"
            role="tab"
            aria-controls="files-panel"
            aria-selected="true"
          >
            <svg class="ic"><use href="#i-files" /></svg>文件
            <span id="file-count" class="badge"></span></button
          ><button
            id="texts-tab"
            class="tab"
            role="tab"
            aria-controls="texts-panel"
            aria-selected="false"
            tabindex="-1"
          >
            <svg class="ic"><use href="#i-text" /></svg>文本
            <span id="text-count" class="badge"></span>
          </button>
        </nav>
        <section id="files-panel" role="tabpanel" aria-labelledby="files-tab">
          <div id="upload-zone" class="drop" hidden>
            <button id="choose-files">
              <svg class="ic"><use href="#i-upload" /></svg>上传文件</button
            ><button id="choose-folder">
              <svg class="ic"><use href="#i-folder" /></svg>上传文件夹</button
            ><input id="upload-files" type="file" multiple hidden /><input
              id="upload-folder"
              type="file"
              webkitdirectory
              multiple
              hidden
            />
          </div>
          <div id="queue" aria-live="polite"></div>
          <div class="section-tools">
            <input
              id="search"
              class="search"
              type="search"
              aria-label="搜索文件"
              placeholder="搜索文件"
            /><button id="download-selected" disabled>
              <svg class="ic"><use href="#i-download" /></svg>下载所选</button
            ><button id="download-all">
              <svg class="ic"><use href="#i-download" /></svg>全部下载</button
            ><button id="refresh" class="tool" title="刷新" aria-label="刷新">
              <svg class="ic"><use href="#i-refresh" /></svg>
            </button>
          </div>
          <div class="file-head">
            <input
              id="select-all"
              type="checkbox"
              aria-label="选择全部文件"
            /><span>文件名</span><span class="size">大小</span><span></span>
          </div>
          <div id="files"></div>
          <div id="file-empty" class="empty">暂无文件</div>
        </section>
        <section
          id="texts-panel"
          role="tabpanel"
          aria-labelledby="texts-tab"
          hidden
        >
          <form id="text-form" class="text-compose" hidden>
            <textarea
              id="text-input"
              aria-label="要发送的文本"
              placeholder="文本或链接"
            ></textarea>
            <div class="section-tools">
              <button id="send-text" class="primary" type="submit">
                <svg class="ic"><use href="#i-upload" /></svg>发送文本
              </button>
            </div>
          </form>
          <div id="texts"></div>
          <div id="text-empty" class="empty">暂无文本</div>
        </section>
      </section>
    </main>
    <dialog id="preview" aria-labelledby="preview-title">
      <div class="dialog-head">
        <h2 id="preview-title"></h2>
        <button
          id="copy-text"
          class="tool"
          title="复制文本"
          aria-label="复制文本"
          hidden
        >
          <svg class="ic"><use href="#i-text" /></svg></button
        ><a id="preview-download" class="tool" title="下载" aria-label="下载"
          ><svg class="ic"><use href="#i-download" /></svg></a
        ><button
          id="preview-close"
          class="tool"
          title="关闭预览"
          aria-label="关闭预览"
        >
          <svg class="ic"><use href="#i-x" /></svg>
        </button>
      </div>
      <div id="preview-body" class="preview-body"></div>
    </dialog>
    <iframe name="download-frame" title="文件下载" hidden></iframe>
    <div id="notice" class="notice" role="status" hidden></div>
    <script>
      "use strict";
      const $ = (id) => document.getElementById(id),
        picks = new Set(),
        textCache = new Map(),
        jobs = [];
      let state = null,
        epoch = 0,
        noticeTimer,
        processing = false,
        activeText = "",
        currentTab = "files";
      const bytes = (n) => {
        for (const unit of ["B", "KiB", "MiB", "GiB", "TiB"]) {
          if (n < 1024 || unit === "TiB")
            return (unit === "B" ? n.toFixed(0) : n.toFixed(1)) + " " + unit;
          n /= 1024;
        }
      };
      function icon(name) {
        const svg = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "svg",
          ),
          use = document.createElementNS(svg.namespaceURI, "use");
        svg.classList.add("ic");
        svg.setAttribute("aria-hidden", "true");
        use.setAttribute("href", "#i-" + name);
        svg.append(use);
        return svg;
      }
      function element(tag, text, className) {
        const node = document.createElement(tag);
        if (text !== undefined) node.textContent = text;
        if (className) node.className = className;
        return node;
      }
      function tool(name, label, action) {
        const node = element("button", undefined, "tool");
        node.type = "button";
        node.title = label;
        node.setAttribute("aria-label", label);
        node.append(icon(name));
        node.onclick = action;
        return node;
      }
      function notify(message) {
        $("notice").textContent = message;
        $("notice").hidden = false;
        clearTimeout(noticeTimer);
        noticeTimer = setTimeout(() => ($("notice").hidden = true), 4000);
      }
      function closePreview() {
        $("preview").close();
        $("preview-body").replaceChildren();
        activeText = "";
      }
      function showLogin(message = "") {
        epoch++;
        state = null;
        picks.clear();
        textCache.clear();
        $("files").replaceChildren();
        $("texts").replaceChildren();
        $("content").hidden = true;
        $("logout").hidden = true;
        $("login").hidden = false;
        $("login-error").textContent = message;
        closePreview();
      }
      async function api(path, options = {}) {
        const headers = { ...options.headers };
        if (state && path !== "/api/login" && path !== "/api/logout")
          headers["X-LANDrop-Share"] = state.share.id;
        const response = await fetch(path, {
          credentials: "same-origin",
          ...options,
          headers,
        });
        if (!response.ok) {
          let payload = {};
          try {
            payload = await response.json();
          } catch {}
          const error = new Error(payload.error || "请求未完成");
          error.status = response.status;
          if (
            response.status === 401 ||
            (response.status === 409 && path === "/api/files")
          )
            showLogin(error.message);
          throw error;
        }
        return response;
      }
      function fileURL(file, preview = "") {
        const query = new URLSearchParams({
          id: file.id,
          version: file.version,
          share: state.share.id,
        });
        if (preview) query.set("preview", preview);
        return "/api/download?" + query;
      }
      function kind(name) {
        const ext = name.split(".").pop().toLowerCase();
        if (["png", "jpg", "jpeg", "gif", "webp", "avif", "bmp"].includes(ext))
          return "image";
        if (["mp4", "webm", "ogv", "mov"].includes(ext)) return "video";
        if (["mp3", "wav", "ogg", "m4a", "flac"].includes(ext)) return "audio";
        if (
          [
            "txt",
            "md",
            "json",
            "csv",
            "tsv",
            "log",
            "py",
            "js",
            "css",
            "html",
            "xml",
            "yaml",
            "yml",
            "toml",
            "ini",
            "sh",
            "c",
            "cpp",
            "rs",
            "go",
          ].includes(ext)
        )
          return "text";
        return "";
      }
      function setTab(tab) {
        currentTab = tab;
        for (const name of ["files", "texts"]) {
          $(name + "-panel").hidden = name !== tab;
          $(name + "-tab").setAttribute("aria-selected", String(name === tab));
          $(name + "-tab").tabIndex = name === tab ? 0 : -1;
        }
      }
      function updateSelection() {
        const visible = filteredFiles();
        $("select-all").checked =
          !!visible.length && visible.every((file) => picks.has(file.id));
        $("select-all").indeterminate =
          visible.some((file) => picks.has(file.id)) &&
          !$("select-all").checked;
        $("download-selected").disabled = !picks.size;
      }
      function filteredFiles() {
        const query = $("search").value.toLocaleLowerCase();
        return state.files.filter((file) =>
          file.name.toLocaleLowerCase().includes(query),
        );
      }
      function renderFiles() {
        const rows = [];
        for (const file of filteredFiles()) {
          const row = element("div", undefined, "file-row"),
            check = element("input");
          check.type = "checkbox";
          check.checked = picks.has(file.id);
          check.setAttribute("aria-label", "选择 " + file.name);
          check.onchange = () => {
            check.checked ? picks.add(file.id) : picks.delete(file.id);
            updateSelection();
          };
          const title = element("div", undefined, "file-name"),
            label = element("div", undefined, "file-label"),
            link = element("a", file.name.split("/").pop());
          link.href = fileURL(file);
          link.download = "";
          link.title = file.name;
          label.append(link);
          const parent = file.name.includes("/")
            ? file.name.slice(0, file.name.lastIndexOf("/"))
            : "";
          if (parent) label.append(element("span", parent, "path"));
          title.append(icon("file"), label);
          const actions = element("div", undefined, "actions"),
            type = kind(file.name);
          if (type)
            actions.append(
              tool("eye", "预览 " + file.name, () => previewFile(file, type)),
            );
          const download = element("a", undefined, "tool");
          download.href = fileURL(file);
          download.download = "";
          download.title = "下载 " + file.name;
          download.setAttribute("aria-label", download.title);
          download.append(icon("download"));
          actions.append(download);
          row.append(
            check,
            title,
            element("span", bytes(file.size), "size"),
            actions,
          );
          rows.push(row);
        }
        $("files").replaceChildren(...rows);
        $("file-empty").hidden = !!rows.length;
        $("file-empty").textContent = $("search").value
          ? "无匹配文件"
          : "暂无文件";
        $("download-all").disabled = !state.files.length;
        $("file-count").textContent = String(state.files.length);
        updateSelection();
      }
      async function readText(item) {
        const captured = epoch;
        if (!textCache.has(item.id)) {
          const response = await api(
            "/api/text?" + new URLSearchParams({ id: item.id }),
          );
          const text = await response.text();
          if (captured !== epoch) throw new Error("分享已切换");
          textCache.set(item.id, text);
          while (textCache.size > 4) textCache.delete(textCache.keys().next().value);
        }
        return textCache.get(item.id);
      }
      async function copy(value) {
        try {
          if (navigator.clipboard) await navigator.clipboard.writeText(value);
          else {
            const field = element("textarea", value);
            field.style.position = "fixed";
            field.style.top = "-10000px";
            ($("preview").open ? $("preview") : document.body).append(field);
            field.focus();
            field.select();
            const ok = document.execCommand("copy");
            field.remove();
            if (!ok) throw new Error("复制未成功");
          }
          notify("已复制");
        } catch {
          notify("无法自动复制，请选中文本复制");
        }
      }
      function renderTexts() {
        const rows = [];
        state.texts.forEach((item, index) => {
          const row = element("div", undefined, "text-row"),
            summary = element("div", undefined, "summary");
          summary.append(
            element("span", "文本 " + (index + 1)),
            element(
              "small",
              (item.received ? "收到 · " : "") +
                bytes(item.size) +
                " · " +
                new Date(item.created_at * 1000).toLocaleString(),
            ),
          );
          row.append(
            icon("text"),
            summary,
            tool("eye", "查看文本 " + (index + 1), async () => {
              try {
                activeText = await readText(item);
                $("preview-title").textContent = "文本 " + (index + 1);
                $("preview-body").replaceChildren(element("pre", activeText));
                $("copy-text").hidden = false;
                $("preview-download").hidden = true;
                $("preview").showModal();
              } catch (error) {
                notify(error.message);
              }
            }),
            tool("text", "复制文本 " + (index + 1), async () => {
              try {
                await copy(await readText(item));
              } catch (error) {
                notify(error.message);
              }
            }),
          );
          rows.push(row);
        });
        $("texts").replaceChildren(...rows);
        $("text-empty").hidden = !!rows.length;
        $("text-count").textContent = String(state.texts.length);
      }
      function render() {
        const focused = document.activeElement;
        const restore = ($("files").contains(focused) || $("texts").contains(focused))
          ? focused.getAttribute("aria-label") : null;
        $("login").hidden = true;
        $("content").hidden = false;
        $("logout").hidden = false;
        $("share-name").textContent = state.share.label;
        $("expires").textContent = state.share.expires_at
          ? "有效至 " + new Date(state.share.expires_at * 1000).toLocaleString()
          : "";
        $("upload-zone").hidden = !state.share.allow_upload;
        $("text-form").hidden = !state.share.allow_upload;
        const valid = new Set(state.files.map((file) => file.id));
        for (const id of picks) if (!valid.has(id)) picks.delete(id);
        renderFiles();
        renderTexts();
        renderQueue();
        if (restore) {
          const replacement = [...document.querySelectorAll("[aria-label]")]
            .find(node => node.getAttribute("aria-label") === restore);
          replacement?.focus({preventScroll: true});
        }
      }
      async function refresh() {
        const captured = epoch;
        try {
          const next = await (await api("/api/files")).json();
          if (captured !== epoch) return;
          const visible = value => JSON.stringify([value.share, value.texts, value.limits,
            value.files.map(({id, name, path, size, version}) => ({id, name, path, size, version}))]);
          const changed = !state || visible(state) !== visible(next);
          state = next;
          if (changed) render();
        } catch (error) {
          if (error.status !== 401) notify(error.message);
        }
      }
      async function login(code) {
        $("login-button").disabled = true;
        $("login-error").textContent = "";
        try {
          state = await (
            await api("/api/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ code }),
            })
          ).json();
          epoch++;
          picks.clear();
          textCache.clear();
          render();
        } catch (error) {
          $("login-error").textContent = error.message;
        } finally {
          $("login-button").disabled = false;
        }
      }
      async function previewFile(file, type) {
        const limit = state.limits[type + "_preview"];
        if (limit && file.size > limit) {
          notify("超过预览上限，可直接下载");
          return;
        }
        $("preview-title").textContent = file.name;
        $("preview-body").replaceChildren(element("p", "加载中…"));
        $("preview-download").href = fileURL(file);
        $("preview-download").download = "";
        $("preview-download").hidden = false;
        $("copy-text").hidden = true;
        $("preview").showModal();
        try {
          if (type === "text") {
            const captured = epoch;
            const text = await (await api(fileURL(file, "text"))).text();
            if (captured !== epoch) return;
            $("preview-body").replaceChildren(element("pre", text));
          } else {
            const media = element(type === "image" ? "img" : type);
            media.src = fileURL(file, type);
            if (type === "image") media.alt = file.name;
            else {
              media.controls = true;
              media.preload = "metadata";
            }
            media.onerror = () =>
              $("preview-body").replaceChildren(
                element("p", "无法预览，可直接下载"),
              );
            $("preview-body").replaceChildren(media);
          }
        } catch (error) {
          $("preview-body").replaceChildren(element("p", error.message));
        }
      }
      function downloadZip(ids) {
        if (!state) return;
        const form = element("form");
        form.method = "POST";
        form.action =
          "/api/zip?" + new URLSearchParams({ share: state.share.id });
        form.target = "download-frame";
        if (ids) {
          const input = element("input");
          input.type = "hidden";
          input.name = "ids";
          input.value = JSON.stringify(ids);
          form.append(input);
        }
        document.body.append(form);
        form.submit();
        form.remove();
      }
      function uploadCache(scope) {
        try {
          return JSON.parse(
            localStorage.getItem("ld-uploads:" + scope) || "{}",
          );
        } catch {
          return {};
        }
      }
      function cacheJob(job, remove = false) {
        try {
          const cache = uploadCache(job.scope);
          if (remove) delete cache[job.key];
          else cache[job.key] = job.id;
          localStorage.setItem(
            "ld-uploads:" + job.scope,
            JSON.stringify(cache),
          );
        } catch {}
      }
      function renderQueue() {
        const rows = [];
        for (const job of jobs.filter(
          (job) => state && job.scope === state.share.id,
        )) {
          const row = element("div", undefined, "queue-row"),
            name = element("div", job.name, "queue-name"),
            progress = element("progress");
          progress.max = job.file.size || 1;
          progress.value = job.done || (job.status === "done" ? 1 : 0);
          name.append(progress);
          if (job.error) name.append(element("small", job.error));
          const labels = {
            queued: "等待",
            sending: bytes(job.done),
            done: "已收到",
            error: "未完成",
            cancelled: "已取消",
          };
          row.append(name, element("span", labels[job.status], "queue-state"));
          if (job.status === "sending" || job.status === "queued")
            row.append(
              tool("x", "取消上传 " + job.name, () => cancelUpload(job)),
            );
          else if (job.status === "error" || job.status === "cancelled")
            row.append(
              tool("refresh", "重试上传 " + job.name, () => {
                job.cancelled = false;
                job.status = "queued";
                job.error = "";
                if (!job.id)
                  job.id = crypto.randomUUID
                    ? crypto.randomUUID().replaceAll("-", "")
                    : Array.from(
                        crypto.getRandomValues(new Uint8Array(16)),
                        (n) => n.toString(16).padStart(2, "0"),
                      ).join("");
                cacheJob(job);
                renderQueue();
                processUploads();
              }),
            );
          else row.append(element("span"));
          rows.push(row);
        }
        $("queue").replaceChildren(...rows);
      }
      function cancelUpload(job) {
        job.cancelled = true;
        job.xhr?.abort();
        job.status = "cancelled";
        cacheJob(job, true);
        if (job.id && state && state.share.id === job.scope)
          api("/api/upload?" + new URLSearchParams({ id: job.id }), {
            method: "DELETE",
          }).catch(() => {});
        job.id = "";
        renderQueue();
      }
      function addFiles(files) {
        if (!state?.share.allow_upload) return;
        for (const file of files) {
          const name = file.webkitRelativePath || file.name,
            key = name + ":" + file.size + ":" + file.lastModified,
            scope = state.share.id,
            id =
              uploadCache(scope)[key] ||
              Array.from(crypto.getRandomValues(new Uint8Array(16)), (n) =>
                n.toString(16).padStart(2, "0"),
              ).join("");
          jobs.push({
            file,
            name,
            key,
            scope,
            id,
            status: "queued",
            done: 0,
            error: "",
            cancelled: false,
          });
        }
        renderQueue();
        processUploads();
      }
      function sendChunk(job, offset, digest) {
        return new Promise((resolve, reject) => {
          const xhr = (job.xhr = new XMLHttpRequest()),
            params = new URLSearchParams({
              id: job.id,
              path: job.name,
              total: job.file.size,
              offset,
              sha256: digest,
            });
          xhr.open("PUT", "/api/upload?" + params);
          xhr.setRequestHeader("Content-Type", "application/octet-stream");
          xhr.setRequestHeader("X-LANDrop-Share", job.scope);
          xhr.timeout = 300000;
          xhr.upload.onprogress = (event) => {
            job.done = Math.min(job.file.size, offset + event.loaded);
            renderQueue();
          };
          xhr.onload = () => {
            let result = {};
            try {
              result = JSON.parse(xhr.responseText);
            } catch {}
            if (
              xhr.status === 409 &&
              xhr.getResponseHeader("X-Expected-Offset")
            ) {
              resolve({
                offset: Number(xhr.getResponseHeader("X-Expected-Offset")),
              });
            } else if (xhr.status >= 200 && xhr.status < 300) resolve(result);
            else {
              const error = new Error(result.error || "上传未完成");
              error.status = xhr.status;
              reject(error);
            }
          };
          xhr.onerror = xhr.ontimeout = () =>
            reject(new Error("连接中断，可重试续传"));
          xhr.onabort = () => reject(new Error("已取消"));
          xhr.send(job.file.slice(offset, offset + 4 * 1024 * 1024));
        });
      }
      async function processUploads() {
        if (processing) return;
        processing = true;
        try {
          while (state) {
            const job = jobs.find(
              (job) => job.status === "queued" && job.scope === state.share.id,
            );
            if (!job) break;
            job.status = "sending";
            cacheJob(job);
            renderQueue();
            try {
              let digest = "",
                offset = 0;
              if (crypto.subtle && job.file.size <= 16 * 1024 * 1024)
                digest = Array.from(
                  new Uint8Array(
                    await crypto.subtle.digest(
                      "SHA-256",
                      await job.file.arrayBuffer(),
                    ),
                  ),
                  (n) => n.toString(16).padStart(2, "0"),
                ).join("");
              while (!job.cancelled) {
                if (!state || state.share.id !== job.scope)
                  throw new Error("分享已切换");
                const result = await sendChunk(job, offset, digest);
                if (result.complete) {
                  job.done = job.file.size;
                  job.status = "done";
                  cacheJob(job, true);
                  break;
                }
                offset =
                  result.offset ??
                  Math.min(job.file.size, offset + 4 * 1024 * 1024);
                if (result.publishing)
                  await new Promise((resolve) => setTimeout(resolve, 300));
              }
              if (job.cancelled) job.status = "cancelled";
            } catch (error) {
              if (!job.cancelled) {
                job.status = "error";
                job.error = error.message;
              }
            }
            job.xhr = null;
            renderQueue();
            if (state) await refresh();
          }
        } finally {
          processing = false;
        }
      }
      $("login-form").onsubmit = (event) => {
        event.preventDefault();
        login($("code").value);
      };
      $("code").oninput = () =>
        ($("code").value = $("code")
          .value.replace(/[^0-9]/g, "")
          .slice(0, 6));
      $("logout").onclick = async () => {
        try {
          await api("/api/logout", { method: "POST" });
          showLogin();
        } catch (error) {
          notify(error.message);
        }
      };
      $("theme").onclick = () => {
        const dark =
          getComputedStyle(document.documentElement)
            .getPropertyValue("--bg")
            .trim() === "#161b18";
        document.documentElement.dataset.theme = dark ? "light" : "dark";
        try {
          localStorage.setItem(
            "ld-theme",
            document.documentElement.dataset.theme,
          );
        } catch {}
      };
      try {
        const theme = localStorage.getItem("ld-theme");
        if (theme === "dark" || theme === "light")
          document.documentElement.dataset.theme = theme;
      } catch {}
      for (const tab of ["files", "texts"]) {
        $(tab + "-tab").onclick = () => setTab(tab);
        $(tab + "-tab").onkeydown = (event) => {
          if (["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) {
            event.preventDefault();
            const next = event.key === "Home" ? "files" : event.key === "End" ? "texts" :
              currentTab === "files" ? "texts" : "files";
            setTab(next);
            $(next + "-tab").focus();
          }
        };
      }
      $("search").oninput = () => state && renderFiles();
      $("refresh").onclick = refresh;
      $("select-all").onchange = () => {
        for (const file of filteredFiles())
          $("select-all").checked ? picks.add(file.id) : picks.delete(file.id);
        renderFiles();
      };
      $("download-selected").onclick = () => downloadZip([...picks]);
      $("download-all").onclick = () => downloadZip();
      $("choose-files").onclick = () => $("upload-files").click();
      $("choose-folder").onclick = () => $("upload-folder").click();
      for (const id of ["upload-files", "upload-folder"]) {
        $(id).onchange = () => {
          addFiles($(id).files);
          $(id).value = "";
        };
      }
      $("choose-folder").hidden = !("webkitdirectory" in $("upload-folder"));
      $("upload-zone").ondragover = (event) => {
        event.preventDefault();
        $("upload-zone").classList.add("drag");
      };
      $("upload-zone").ondragleave = () =>
        $("upload-zone").classList.remove("drag");
      $("upload-zone").ondrop = (event) => {
        event.preventDefault();
        $("upload-zone").classList.remove("drag");
        addFiles(event.dataTransfer.files);
      };
      $("text-form").onsubmit = async (event) => {
        event.preventDefault();
        const value = $("text-input").value;
        if (!value.trim()) {
          notify("文本不能为空");
          return;
        }
        if (new TextEncoder().encode(value).length > state.limits.text) {
          notify("单条文本上限为 10 MiB");
          return;
        }
        $("send-text").disabled = true;
        try {
          await api("/api/text", {
            method: "POST",
            headers: { "Content-Type": "text/plain; charset=utf-8" },
            body: value,
          });
          $("text-input").value = "";
          notify("文本已提交");
          await refresh();
        } catch (error) {
          notify(error.message);
        } finally {
          $("send-text").disabled = false;
        }
      };
      $("preview-close").onclick = closePreview;
      $("preview").addEventListener("close", () => {
        $("preview-body").replaceChildren();
        activeText = "";
      });
      $("copy-text").onclick = () => copy(activeText);
      const initialCode = new URLSearchParams(location.hash.slice(1)).get(
        "code",
      );
      if (location.hash) history.replaceState(null, "", location.pathname);
      if (initialCode) {
        $("code").value = initialCode;
        login(initialCode);
      } else
        api("/api/files")
          .then((response) => response.json())
          .then((value) => {
            state = value;
            render();
          })
          .catch(() => showLogin());
      setInterval(() => {
        if (state && !document.hidden) refresh();
      }, 3000);
    </script>
  </body>
</html>
