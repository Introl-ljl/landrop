<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>LAN Drop · 管理面板</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%2319cfa8'/%3E%3Cpath d='M20 7.5c5.3 6.2 9.3 11.2 9.3 16a9.3 9.3 0 0 1-18.6 0c0-4.8 4-9.8 9.3-16Z' fill='%23052019'/%3E%3C/svg%3E">
<style>
:root{
  --font:"Inter","SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;
  --bg:#f4f3f0; --surface:#fff; --surface-2:#f7f6f3; --line:rgba(22,24,29,.09);
  --text:#15171c; --text-2:#464a53; --muted:#6b6f78;
  --accent:#0fc39d; --accent-ink:#032019; --accent-text:#087a64; --accent-soft:rgba(15,195,157,.13);
  --danger:#e2404c; --danger-soft:rgba(226,64,76,.1);
  --warn:#b45309; --warn-soft:rgba(180,83,9,.1);
  --r-sm:10px; --r-md:14px; --r-lg:18px;
  --shadow:0 1px 2px rgba(20,22,27,.05),0 12px 30px -18px rgba(20,22,27,.3);
}
:root[data-theme="dark"]{
  --bg:#08090c; --surface:#15181f; --surface-2:#1b1f28; --line:rgba(255,255,255,.1);
  --text:#eceef2; --text-2:#b0b6c0; --muted:#868c96;
  --accent:#2fe6bd; --accent-ink:#032019; --accent-text:#5ceecd; --accent-soft:rgba(47,230,189,.14);
  --danger:#ff6b74; --danger-soft:rgba(255,107,116,.14); --warn:#fbbf24; --warn-soft:rgba(251,191,36,.12);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 16px 40px -22px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:var(--font); background:var(--bg); color:var(--text);
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
code,kbd,.mono{font-family:var(--mono); font-size:.86em}
.wrap{max-width:1080px; margin:0 auto; padding:28px 20px 64px}
header{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:8px}
h1{font-size:20px; margin:0; letter-spacing:.2px}
h1 b{color:var(--accent-text)}
h2{font-size:15px; margin:0 0 4px; letter-spacing:.2px}
.sub{color:var(--muted); font-size:13px; margin:0 0 22px}
.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg);
  padding:18px; margin-bottom:18px; box-shadow:var(--shadow);
}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end}
label{display:block; font-size:12px; color:var(--muted); margin-bottom:5px}
input,select{
  font:inherit; color:var(--text); background:var(--surface-2);
  border:1px solid var(--line); border-radius:var(--r-sm); padding:8px 11px; min-width:0;
}
input:focus,select:focus{outline:2px solid var(--accent-soft); border-color:var(--accent)}
.grow{flex:1 1 220px}
.btn{
  font:inherit; font-weight:600; cursor:pointer; border-radius:var(--r-sm);
  border:1px solid var(--line); background:var(--surface-2); color:var(--text);
  padding:9px 15px; white-space:nowrap;
}
.btn:hover{border-color:var(--accent)}
.btn-primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn-danger{background:var(--danger-soft); border-color:var(--danger); color:var(--danger)}
.btn-sm{padding:5px 10px; font-size:13px}
.btn[disabled]{opacity:.5; cursor:not-allowed}
table{width:100%; border-collapse:collapse; font-size:14px}
th,td{text-align:left; padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:middle}
th{font-size:12px; color:var(--muted); font-weight:600; text-transform:none}
tr:last-child td{border-bottom:none}
.pill{
  display:inline-block; padding:2px 9px; border-radius:999px; font-size:12px;
  background:var(--surface-2); border:1px solid var(--line); color:var(--text-2);
}
.pill.perm-upload{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-text)}
.pill.perm-read{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-text)}
.pill.perm-delete_own{background:var(--warn-soft); border-color:var(--warn); color:var(--warn)}
.pill.perm-full{background:var(--danger-soft); border-color:var(--danger); color:var(--danger)}
.pill.off{opacity:.6; text-decoration:line-through}
.secret{
  font-family:var(--mono); font-size:12.5px; word-break:break-all;
  background:var(--surface-2); border:1px dashed var(--accent); border-radius:var(--r-sm);
  padding:9px 11px; margin-top:8px;
}
.notes{font-size:12.5px; color:var(--muted)}
.notes b{color:var(--text-2); font-weight:600}
.empty{color:var(--muted); font-size:13px; padding:14px 2px}
.toasts{position:fixed; left:50%; bottom:22px; transform:translateX(-50%); display:flex; flex-direction:column; gap:8px; z-index:50}
.toast{
  background:var(--text); color:var(--bg); padding:9px 15px; border-radius:999px;
  font-size:13.5px; box-shadow:var(--shadow); max-width:min(90vw,560px);
}
.toast.err{background:var(--danger); color:#fff}
.toast.ok{background:var(--accent); color:var(--accent-ink)}
.gate{max-width:380px; margin:12vh auto; text-align:center}
.gate .card{padding:26px}
.hidden{display:none !important}
.spacer{flex:1 1 auto}
.hint{font-size:12.5px; color:var(--muted); margin-top:8px}
</style>
</head>
<body>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<div class="gate" id="gate">
  <div class="card">
    <h1>LAN<b>Drop</b> 管理面板</h1>
    <p class="sub">输入管理员密钥以管理空间与分享链接</p>
    <div class="row">
      <div class="grow"><label for="keyInput">管理员密钥</label>
        <input type="password" id="keyInput" placeholder="管理员密钥" autocomplete="current-password"></div>
    </div>
    <button class="btn btn-primary" id="loginBtn" style="width:100%;margin-top:14px">进入</button>
    <p class="hint">密钥见服务启动日志，或数据目录下的 <code>admin-key.txt</code></p>
  </div>
</div>

<div class="wrap hidden" id="app">
  <header>
    <h1>LAN<b>Drop</b> 管理面板</h1>
    <span class="spacer"></span>
    <button class="btn btn-sm" id="refreshBtn">刷新</button>
    <button class="btn btn-sm" id="themeBtn">主题</button>
    <button class="btn btn-sm" id="logoutBtn">退出</button>
  </header>
  <p class="sub" id="where"></p>

  <section class="card">
    <h2>新建分享链接</h2>
    <p class="notes">每条链接独立生效，可随时撤销或轮换。权限只对“这条链接打开的页面”有效。</p>
    <div class="row" style="margin-top:12px">
      <div class="grow"><label for="gLabel">标签（方便自己辨认）</label>
        <input id="gLabel" placeholder="例如：产品图收集 / 张老师"></div>
      <div><label for="gSpace">空间</label><select id="gSpace"></select></div>
      <div><label for="gPerm">权限</label>
        <select id="gPerm">
          <option value="upload">仅上传（看不到已有文件）</option>
          <option value="read">仅下载（可读，不能上传/删除）</option>
          <option value="delete_own" selected>上传 + 可读，只能删自己的</option>
          <option value="full">完整读写（可删全部）</option>
        </select></div>
      <div><label for="gMode">凭证形式</label>
        <select id="gMode">
          <option value="token" selected>链接密钥</option>
          <option value="password">人类口令</option>
        </select></div>
      <div><label for="gPass">口令（留空自动生成）</label>
        <input id="gPass" placeholder="仅口令模式使用"></div>
      <div><label for="gExp">有效期（天，留空长期）</label>
        <input id="gExp" inputmode="numeric" placeholder="长期"></div>
      <button class="btn btn-primary" id="createBtn">创建链接</button>
    </div>
    <div class="secret hidden" id="newSecret"></div>
    <p class="hint hidden" id="newHint"></p>
  </section>

  <section class="card">
    <h2>新建空间</h2>
    <p class="notes">空间=独立的共享目录 + 独立的链接集合，彼此文件不互通。</p>
    <div class="row" style="margin-top:12px">
      <div class="grow"><label for="sName">空间名称</label>
        <input id="sName" placeholder="例如：毕业照收集"></div>
      <div class="grow"><label for="sRoot">存储位置（留空则用数据目录的 files/）</label>
        <input id="sRoot" placeholder="/mnt/disk/share 或 D:\\share"></div>
      <button class="btn btn-primary" id="spaceBtn">创建空间</button>
    </div>
  </section>

  <section class="card">
    <h2>授权与链接</h2>
    <div id="grantBox"><p class="empty">加载中…</p></div>
  </section>

  <section class="card">
    <h2>空间</h2>
    <div id="spaceBox"><p class="empty">加载中…</p></div>
  </section>
</div>

<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const api = (u, o) => fetch(u, Object.assign({credentials:"same-origin"}, o));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function toast(msg, type = "info"){
  const el = document.createElement("div");
  el.className = "toast " + type;
  el.textContent = msg;
  $("#toasts").appendChild(el);
  setTimeout(() => el.remove(), type === "err" ? 5000 : 3000);
}
const THEME = "landrop-theme";
function applyTheme(t){ document.documentElement.setAttribute("data-theme", t); }
(function initTheme(){
  let t = null;
  try{ t = localStorage.getItem(THEME); }catch(e){}
  if(t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  applyTheme(t);
})();
$("#themeBtn").addEventListener("click", () => {
  const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  applyTheme(next);
  try{ localStorage.setItem(THEME, next); }catch(e){}
});

const PERM_TEXT = {
  upload: "仅上传", read: "仅下载", delete_own: "可读 · 只删自己的", full: "完整读写",
};
const MODE_TEXT = { token: "链接密钥", password: "口令" };

let state = { spaces: [], grants: [], publicUrl: "" };

async function jget(url){
  const r = await api(url);
  if(r.status === 401){ showGate(); throw new Error("unauthorized"); }
  const d = await r.json().catch(() => ({}));
  if(!r.ok || !d.ok) throw new Error(d.error || ("HTTP " + r.status));
  return d;
}
async function jpost(url, body){
  const r = await api(url, {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body || {}),
  });
  const d = await r.json().catch(() => ({}));
  if(r.status === 401){ showGate(); throw new Error("unauthorized"); }
  if(!r.ok || !d.ok) throw new Error(d.error || ("HTTP " + r.status));
  return d;
}

function showGate(){
  $("#app").classList.add("hidden");
  $("#gate").classList.remove("hidden");
  setTimeout(() => $("#keyInput").focus(), 60);
}
function showApp(){ $("#gate").classList.add("hidden"); $("#app").classList.remove("hidden"); }

$("#loginBtn").addEventListener("click", doLogin);
$("#keyInput").addEventListener("keydown", e => { if(e.key === "Enter") doLogin(); });
async function doLogin(){
  const key = $("#keyInput").value.trim();
  if(!key){ toast("请输入管理员密钥", "err"); return; }
  $("#loginBtn").disabled = true;
  try{
    const r = await api("/api/login", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({key}),
    });
    const d = await r.json().catch(() => ({}));
    if(!r.ok || !d.ok) throw new Error(d.error || "登录失败");
    if(d.kind !== "admin") throw new Error("这不是管理员密钥，请到首页使用分享链接");
    $("#keyInput").value = "";
    showApp();
    await load();
    toast("已进入管理面板", "ok");
  }catch(e){
    toast(String(e.message || e), "err");
  }finally{
    $("#loginBtn").disabled = false;
  }
}
$("#logoutBtn").addEventListener("click", async () => {
  try{ await api("/api/logout", {method:"POST"}); }catch(e){}
  showGate();
});
$("#refreshBtn").addEventListener("click", () => load());

async function load(){
  const d = await jget("/api/grants");
  state.spaces = d.spaces || [];
  state.grants = d.grants || [];
  state.publicUrl = d.public_url || location.origin;
  $("#where").innerHTML = `访问地址 <code>${esc(state.publicUrl)}</code> · 数据目录 <code>${esc(d.data_dir || "")}</code>`;
  renderSpaces();
  renderGrants();
  const sel = $("#gSpace");
  sel.innerHTML = state.spaces.map(s => `<option value="${esc(s.id)}">${esc(s.name)}</option>`).join("");
}

function renderSpaces(){
  const box = $("#spaceBox");
  if(!state.spaces.length){ box.innerHTML = `<p class="empty">还没有空间。</p>`; return; }
  box.innerHTML = `<table><thead><tr><th>名称</th><th>存储位置</th><th>文件数</th></tr></thead><tbody>` +
    state.spaces.map(s => `<tr>
      <td><b>${esc(s.name)}</b><div class="notes">${esc(s.id)}</div></td>
      <td><code>${esc(s.path || "")}</code></td>
      <td>${s.files == null ? "—" : s.files}</td>
    </tr>`).join("") + `</tbody></table>`;
}

function grantUrl(g){
  if(g.url) return g.url;
  return "";
}
function renderGrants(){
  const box = $("#grantBox");
  if(!state.grants.length){ box.innerHTML = `<p class="empty">还没有任何授权。</p>`; return; }
  const spaceName = id => (state.spaces.find(s => s.id === id) || {}).name || "—";
  box.innerHTML = `<table><thead><tr>
      <th>标签 / 类型</th><th>空间</th><th>权限</th><th>状态</th><th>操作</th>
    </tr></thead><tbody>` + state.grants.map(g => {
    const expired = g.expires_at && g.expires_at * 1000 < Date.now();
    const url = grantUrl(g);
    const cls = g.kind === "admin" ? "full" : g.perm;
    const status = g.revoked ? `<span class="pill off">已撤销</span>`
      : expired ? `<span class="pill off">已过期</span>`
      : `<span class="pill">有效</span>`;
    const exp = g.expires_at
      ? `<div class="notes">到期 ${new Date(g.expires_at * 1000).toLocaleString()}</div>` : "";
    return `<tr>
      <td><b>${esc(g.label || "(未命名)")}</b>
        <div class="notes">${g.kind === "admin" ? "管理员" : "分享"} · ${MODE_TEXT[g.mode] || g.mode}</div></td>
      <td>${g.kind === "admin" ? "—" : esc(spaceName(g.space_id))}</td>
      <td><span class="pill perm-${esc(cls)}">${esc(PERM_TEXT[g.perm] || g.perm)}</span></td>
      <td>${status}${exp}
        <div class="notes">${g.last_used_at ? "最近使用 " + new Date(g.last_used_at * 1000).toLocaleString() : "尚未使用"}</div>
        ${url ? `<div class="secret">${esc(url)}</div>` : ""}</td>
      <td>
        <button class="btn btn-sm" data-act="rotate" data-id="${esc(g.id)}">轮换密钥</button>
        ${g.revoked ? "" : `<button class="btn btn-sm btn-danger" data-act="revoke" data-id="${esc(g.id)}">撤销</button>`}
      </td>
    </tr>`;
  }).join("") + `</tbody></table>
  <p class="hint">出于安全考虑，「轮换密钥」只在轮换时显示一次新密钥；旧密钥立即失效，历史列表里不会保留明文。</p>`;
}

$("#createBtn").addEventListener("click", async () => {
  const body = {
    kind: "share",
    label: $("#gLabel").value.trim(),
    space_id: $("#gSpace").value,
    perm: $("#gPerm").value,
    mode: $("#gMode").value,
    password: $("#gPass").value.trim() || null,
    expires_days: $("#gExp").value.trim() || null,
  };
  try{
    const d = await jpost("/api/grants", body);
    const g = d.grant;
    $("#newSecret").classList.remove("hidden");
    $("#newSecret").textContent = g.url || g.secret || "";
    const hint = $("#newHint");
    hint.classList.remove("hidden");
    hint.textContent = g.url
      ? "把这条链接发给对方即可（页面会自动填入密钥）。密钥不会再次显示，请现在复制。"
      : `口令：${g.secret} —— 请现在复制，关闭后不再显示。`;
    $("#gLabel").value = ""; $("#gPass").value = ""; $("#gExp").value = "";
    await load();
    toast("已创建链接", "ok");
  }catch(e){
    toast(String(e.message || e), "err");
  }
});
$("#newSecret").addEventListener("click", async () => {
  const text = $("#newSecret").textContent;
  try{
    if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(text); }
    else{
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.top = "-1000px";
      document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove();
    }
    toast("已复制", "ok");
  }catch(e){ toast("复制失败，请手动选中复制", "err"); }
});

$("#spaceBtn").addEventListener("click", async () => {
  const name = $("#sName").value.trim();
  if(!name){ toast("请填写空间名称", "err"); return; }
  try{
    await jpost("/api/spaces", {name, root: $("#sRoot").value.trim() || null});
    $("#sName").value = ""; $("#sRoot").value = "";
    await load();
    toast("已创建空间", "ok");
  }catch(e){
    toast(String(e.message || e), "err");
  }
});

$("#grantBox").addEventListener("click", async e => {
  const btn = e.target.closest("[data-act]");
  if(!btn) return;
  const id = btn.dataset.id;
  const act = btn.dataset.act;
  if(act === "revoke"){
    if(!confirm("撤销后该链接立即失效，已登录的页面也会马上失去权限。确定撤销？")) return;
  }
  btn.disabled = true;
  try{
    const d = await jpost(`/api/grants/${act}`, {id});
    if(act === "rotate"){
      const g = d.grant;
      $("#newSecret").classList.remove("hidden");
      $("#newSecret").textContent = g.url || g.secret || "";
      const hint = $("#newHint");
      hint.classList.remove("hidden");
      hint.textContent = "新密钥已生成；旧密钥与会话立即失效。请现在复制。";
    }
    await load();
    toast(act === "rotate" ? "已轮换密钥" : "已撤销授权", "ok");
  }catch(err){
    toast(String(err.message || err), "err");
  }finally{
    btn.disabled = false;
  }
});

(async function init(){
  // 桌面窗口打开管理面板时把密钥放在 #k= 里（片段不会发给服务器）：读完立刻抹掉并自动登录
  const m = /[#&]k=([^&]+)/.exec(location.hash || "");
  if(m){
    let key = m[1];
    try{ key = decodeURIComponent(key); }catch(e){}
    try{ history.replaceState(null, "", location.pathname + location.search); }catch(e){}
    showGate();
    $("#keyInput").value = key;
    return doLogin();
  }
  try{
    const d = await jget("/api/grants");
    state.spaces = d.spaces || []; state.grants = d.grants || [];
    showApp();
    await load();
  }catch(e){
    showGate();
  }
})();
</script>
</body>
</html>
