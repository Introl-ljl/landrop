[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "landrop"
dynamic = ["version"]
description = "Local LAN shares and collection with six-digit access codes. Zero runtime dependencies."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["file-transfer", "lan", "cli", "self-hosted"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: System :: Networking",
]

[project.urls]
Homepage = "https://github.com/Introl-ljl/landrop"

[project.scripts]
landrop = "landrop.cli:main"

[project.gui-scripts]
landrop-gui = "landrop.gui.launcher:main"

[tool.setuptools.dynamic]
version = { attr = "landrop.__version__" }

[tool.setuptools.packages.find]
include = ["landrop*"]

[tool.setuptools.package-data]
"landrop.server" = ["static/*"]
