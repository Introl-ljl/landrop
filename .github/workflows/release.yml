name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:      # 手动运行：只构建与验证安装包，不发布（发布只在 tag 上进行）

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: landrop-*
          path: downloaded
      - name: Checksums
        run: |
          mkdir artifacts
          find downloaded -type f -exec cp {} artifacts/ \;
          cd artifacts
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 每个安装包都是单独的附件（不再按平台打成 zip）；说明写在发布页最上面
          cat > notes.md <<'MD'
          ## v0.3.0：本地分享与收集

          - 统一为一个设备本地服务，桌面仅保留“分享、接收、设置”。
          - 每份分享使用六位数字授权码，支持扫码免输入、一键换码、可选有效期。
          - 支持原文件与动态文件夹分享、流式 ZIP 批量下载和断点续传。
          - 上传与公开收到的内容独立可选；收集自动创建任务子目录，同名文件保留并改名。
          - 简单文本单条上限 10 MiB；文本预览默认 10 MiB、图片默认 20 MiB，可在设置调整。
          - 移除中心中转、管理员密钥、远程管理面板、独立空间与取件次数限制。

          ### 升级注意

          这是不兼容旧授权模型的重构。首次升级先备份旧状态、配置和密钥，磁盘文件保留；旧链接与旧式文件码不再可用，需要在本机重新创建分享。
          旧 `send --server`、管理员参数和 `gui --autostart` 不再支持，命令用法见 README。
          关闭、到期或删除分享不删除磁盘文件；访客删除仍待决策，本版不提供。
          默认使用未加密 HTTP，只用于可信局域网，不要直接暴露公网。

          ## 下载哪个？

          | 平台 | 安装版（含命令行 `landrop`） | 免安装版 |
          | --- | --- | --- |
          | Windows x64 | `…-windows-x86_64-setup.exe` | `…-windows-x86_64-portable.exe`：单文件，双击即用（只有窗口）<br>`…-windows-x86_64-portable.zip`：解压即用，含窗口 + 命令行，数据跟着程序目录 |
          | macOS Apple 芯片 | `…-macos-arm64-setup.pkg` | `…-macos-arm64-portable.dmg` |
          | macOS Intel | `…-macos-x86_64-setup.pkg` | `…-macos-x86_64-portable.dmg` |
          | Linux x64 | `…-linux-x86_64-setup.deb` | `…-linux-x86_64-portable.AppImage`（`chmod +x` 后运行；带参数即命令行） |
          | Linux arm64 | `…-linux-arm64-setup.deb` | `…-linux-arm64-portable.AppImage` |

          装了 Python 3.8+ 的任意系统：`landrop.pyz`。校验值见 `SHA256SUMS`。二进制未签名，首次运行的系统提示见 README。
          MD
          gh release create "${{ github.ref_name }}" artifacts/* \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" --notes-file notes.md --generate-notes

  docker:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
