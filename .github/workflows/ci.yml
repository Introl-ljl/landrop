name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.8", "3.12"]
        exclude:
          - os: macos-latest      # 3.8 has no arm64 build on macOS runners
            python: "3.8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Server smoke tests
        run: python -u tests/smoke.py
      - name: CLI end-to-end tests
        run: python -u tests/cli_check.py
      - name: Transfer recovery regression tests
        run: python -u tests/transfer_check.py
      - name: GUI end-to-end tests (Linux, virtual display)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          xvfb-run -a python -u tests/gui_check.py
      - name: GUI end-to-end tests
        if: runner.os != 'Linux'
        run: python -u tests/gui_check.py

  package:
    name: packages
    uses: ./.github/workflows/build.yml
