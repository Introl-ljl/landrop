services:
  landrop:
    build: .
    image: landrop:latest
    container_name: landrop
    restart: "no"
    command: ["--port", "${LANDROP_PORT:-8000}", "--ip", "${LANDROP_IP:-}", "--collect-dir", "/data/collected"]
    ports:
      - "${LANDROP_PORT:-8000}:${LANDROP_PORT:-8000}"
    environment:
      LANDROP_DATA_DIR: /data
      LANDROP_PORT: "${LANDROP_PORT:-8000}"
      TZ: "${TZ:-Asia/Singapore}"
    volumes:
      - ${LANDROP_DATA_DIR:-./data}:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "${PUID:-1000}:${PGID:-1000}"
    ipc: private
    mem_limit: 512m
    pids_limit: 256
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request;urllib.request.urlopen('http://127.0.0.1:'+os.environ['LANDROP_PORT']+'/',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
